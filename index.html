<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Build together in realtime. A collaborative brick workshop powered by Neon."
    />
    <title>Neon Bricks — build together in realtime</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/inter-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      (() => {
        let preference = "system";
        try {
          preference = localStorage.getItem("neon-bricks-theme") || "system";
        } catch {}
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#0b0c0e" : "#ffffff");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
